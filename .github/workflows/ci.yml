name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests unitaires & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pas de `version:` : elle fait autorité dans le champ `packageManager`
      # de package.json (même pnpm en CI, sur les postes et dans les images).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Le postinstall de @alvm/shared génère le client Prisma.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint, 3 paquets)
        run: pnpm lint:all

      - name: Typecheck (tsc strict, 3 paquets)
        run: pnpm typecheck:all

      - name: Tests unitaires (vitest)
        run: pnpm test:unit

      # Aucune variable d'environnement fournie, volontairement : le build ne
      # doit dépendre ni d'une base ni d'un secret. S'il se met à en réclamer
      # une, c'est qu'une page interroge le back au prérendu.
      - name: Build (tsup + next build)
        run: pnpm build:all

  integration:
    name: Tests d'intégration (PostgreSQL 16 réel, RLS ; Redis 7 réel)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Rôle applicatif NOSUPERUSER NOBYPASSRLS : la RLS s'applique comme en prod.
      TEST_DATABASE_URL: postgresql://alvm_app:alvm_app@localhost:5432/alvm_integration
      # Propriétaire : migrations et préparation des jeux de données.
      TEST_DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/alvm_integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Même script que l'initialisation des bases de production et de staging
      # (deploy/postgres/init-app-role.sh) : il est ainsi exercé à chaque CI.
      - name: Base alvm_integration + rôle applicatif alvm_app
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: alvm_integration
          ALVM_APP_DB_PASSWORD: alvm_app
        run: |
          psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c 'CREATE DATABASE alvm_integration'
          sh deploy/postgres/init-app-role.sh

      # Le globalSetup remet le schéma à zéro puis joue les VRAIES migrations
      # (scripts/db-migrate.ts, droits du rôle applicatif compris) ; sans base,
      # la campagne échoue au lieu d'être ignorée.
      - name: Tests d'intégration (vitest)
        run: pnpm --filter @alvm/back test:integration

      # File alvm-email contre un vrai Redis (producteur + worker) ; Redis
      # absent = échec, jamais un saut (docs/file-emails.md).
      - name: Tests d'intégration de la file d'emails (vitest)
        env:
          REDIS_URL: redis://localhost:6379
        run: pnpm --filter @alvm/back test:integration:email-queue

  images:
    name: Image ${{ matrix.service }}
    # Seule une version verte est publiée : qualité ET intégration d'abord.
    needs: [quality, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [back, front]
    env:
      # Publication sur ghcr.io uniquement pour un push sur master ; une PR
      # construit l'image sans la pousser.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Tag court (SHA du commit)
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Connexion à ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Contexte = racine du monorepo. Image taguée au SHA court, jamais
      # `latest` (CLAUDE.md §7.1) : le staging puis la production servent CE
      # tag — l'artefact validé en staging est celui qui part en production
      # (docs/deploiement-ovh.md § 6).
      - name: Build alvm-${{ matrix.service }}/Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: alvm-${{ matrix.service }}/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/innovia-noumea/asso-saas-${{ matrix.service }}:${{ steps.tag.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/innovia-noumea/asso-saas
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

# Staging asso-saas (ALVM) — srv-innovia (convention /srv/staging/README.md du serveur).
# Même topologie que la production (compose.ovh.yml) : front, back, worker,
# PostgreSQL 16, Redis 7.
#
# Bloc de ports : `staging-ports alloc asso-saas` ; BASE_PORT = port de base du
# bloc (front en 127.0.0.1 ET port HTTPS du tailnet).
#
#   - seul le front se lie à l'hôte, sur 127.0.0.1 ; l'accès passe par
#     `tailscale serve` (staging-ports expose asso-saas) ;
#   - back, worker, base et Redis ne sont JAMAIS liés à l'hôte : réseaux Docker seuls ;
#   - les images sont celles PUBLIÉES PAR LA CI (ghcr.io/innovia-noumea/
#     asso-saas-{front,back}:<sha court>, commit de master à CI verte) — jamais
#     construites ici, jamais `latest`. Le tag validé en staging est celui que
#     la production (Coolify) sert ensuite : même artefact.
#
# Base neuve : `dc --profile ops run --rm migrate`, puis create-super-admin.
# Procédure complète : docs/deploiement-ovh.md § 5.
name: asso-saas-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-back-env: &back-env
  NODE_ENV: production
  PORT: '4001'
  DATABASE_URL: postgresql://alvm_app:${ALVM_APP_DB_PASSWORD:?ALVM_APP_DB_PASSWORD absent du .env}@alvm-postgres:5432/alvm_staging
  AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET absent du .env}
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET absent du .env}
  # Doit valoir exactement `staging-ports url asso-saas` (liens des emails).
  AUTH_URL: ${APP_URL:?APP_URL absent du .env}
  PLATFORM_ENCRYPTION_KEY: ${PLATFORM_ENCRYPTION_KEY:?PLATFORM_ENCRYPTION_KEY absent du .env}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD absent du .env}@alvm-redis:6379
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
  BLOB_PRIVATE_READ_WRITE_TOKEN: ${BLOB_PRIVATE_READ_WRITE_TOKEN:-}
  SOURCE_COMMIT: ${IMAGE_TAG:?IMAGE_TAG absent du .env}

services:
  front:
    image: ghcr.io/innovia-noumea/asso-saas-front:${IMAGE_TAG:?IMAGE_TAG absent du .env}
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET absent du .env}
      # Doit valoir exactement `staging-ports url asso-saas`, sinon les cookies
      # de session et les redirections d'auth cassent.
      AUTH_URL: ${APP_URL:?APP_URL absent du .env}
      API_INTERNAL_URL: http://alvm-back:4001
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET absent du .env}
      # Un seul relais devant le front : `tailscale serve`.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      SOURCE_COMMIT: ${IMAGE_TAG:?IMAGE_TAG absent du .env}
    depends_on:
      back:
        condition: service_healthy
    ports:
      - '127.0.0.1:${BASE_PORT:?BASE_PORT absent du .env}:3000'
    networks: [app]

  back:
    image: ghcr.io/innovia-noumea/asso-saas-back:${IMAGE_TAG:?IMAGE_TAG absent du .env}
    restart: unless-stopped
    logging: *logging
    environment: *back-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Aucun `ports:` — volontaire.
    networks:
      app:
        aliases: [alvm-back]
      data: {}

  worker:
    image: ghcr.io/innovia-noumea/asso-saas-back:${IMAGE_TAG:?IMAGE_TAG absent du .env}
    command: ['worker']
    restart: unless-stopped
    logging: *logging
    environment: *back-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app, data]

  # One-shot, seul détenteur des identifiants propriétaire :
  #   dc --profile ops run --rm migrate
  migrate:
    image: ghcr.io/innovia-noumea/asso-saas-back:${IMAGE_TAG:?IMAGE_TAG absent du .env}
    command: ['migrate']
    profiles: [ops]
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://alvm_app:${ALVM_APP_DB_PASSWORD:?ALVM_APP_DB_PASSWORD absent du .env}@alvm-postgres:5432/alvm_staging
      DATABASE_MIGRATION_URL: postgresql://alvm:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent du .env}@alvm-postgres:5432/alvm_staging
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: alvm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent du .env}
      POSTGRES_DB: alvm_staging
      ALVM_APP_DB_PASSWORD: ${ALVM_APP_DB_PASSWORD:?ALVM_APP_DB_PASSWORD absent du .env}
    volumes:
      # Volume distinct de l'ancien `db-data` (PostgreSQL 17, schéma db-init).
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    # Aucun `ports:` — volontaire. Inspection : dc exec postgres psql -U alvm alvm_staging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alvm -d alvm_staging']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      data:
        aliases: [alvm-postgres]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD absent du .env}
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD absent du .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      data:
        aliases: [alvm-redis]

networks:
  app: {}
  data:
    internal: true

volumes:
  postgres-data:
  redis-data:

<!-- @dsCard group="Formulaires" height=330 subtitle="Champ, liste déroulante, recherche, erreur" -->
<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:20px;background:var(--bg);color:var(--ink);font-family:var(--font-body)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}</style></head><body><div id="root"></div><script>
var A=window.AssoSaas,h=React.createElement;
function App(){return h('div',{style:{display:'grid',gap:'16px',maxWidth:'560px'}},
 h(A.Field,{label:'Nom de l’organisation',required:true,htmlFor:'n'},h(A.Input,{id:'n',defaultValue:'PASPORT'})),
 h(A.Field,{label:'Statut',htmlFor:'s'},h(A.Select,{id:'s',options:[{value:'a',label:'Actifs'},{value:'i',label:'Inactifs'}]})),
 h(A.Field,{label:'Adresse',required:true,htmlFor:'a',error:'Ce champ est obligatoire.'},h(A.Input,{id:'a',invalid:true,placeholder:'Numéro et rue'})),
 h(A.Field,{label:'Nom court',hint:'Affiché dans la barre du haut.',htmlFor:'c'},h(A.Input,{id:'c',placeholder:'Ex : Mon association'})),
 h(A.SearchBar,{placeholder:'Rechercher par nom, email ou téléphone...'}));}
ReactDOM.createRoot(document.getElementById('root')).render(App());
</script></body></html>

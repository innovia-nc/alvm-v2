var rows=[{nom:'Lucile DELACROIX',email:'lucile@pasport.nc',role:'Personnel',tone:'success',montant:'0 XPF',code:'512000'},{nom:'Jemila MOLE',email:'jemila@pasport.nc',role:'Personnel',tone:'success',montant:'45 000 XPF',code:'511200'},{nom:'BECKER',email:'direction@pasport.nc',role:'Administrateur',tone:'neutral',montant:'120 500 XPF',code:'530000'}];
return h(A.DataTable,{columns:cols,rows:rows,footer:'1 à 3 sur 3 résultats'});}
ReactDOM.createRoot(document.getElementById('root')).render(App());
</script></body></html>
